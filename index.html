<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA5 Toolkit</title>
<style>
  /* 自定义字体：exe 同目录 font.ttf 拷入 ui/fonts/，作为 UI 主字体 */
  @font-face {
    font-family: "GTAFont";
    src: url('fonts/font.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  /* 滚动条（WebView2 Launcher 款式：3px 细条 + 半透明白 thumb） */
  ::-webkit-scrollbar { width:3px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:2px; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.30); }

  body {
    font-family:"GTAFont";
    background:#0d1117 url('img/bg.jpeg') center/cover no-repeat fixed;
    color:#e6edf3;
    height:100vh; overflow:hidden; user-select:none;
  }
  .app { display:flex; flex-direction:column; height:100vh; }

  /* 顶栏横幅：半透明玻璃条，透出背后的猫娘背景图 */
  .banner {
    position:relative;
    padding:24px 22px; font-size:24px; font-weight:700; letter-spacing:1px;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
    color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.7);
    display:flex; align-items:center; gap:12px;
    overflow:hidden;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .banner small { font-size:12px; font-weight:400; opacity:.9; letter-spacing:0; }

  /* 顶栏拖拽区（WebView2 原生 app-region：可拖动，按钮区 no-drag） */
  .banner { -webkit-app-region: drag; }
  .banner button, .window-controls { -webkit-app-region: no-drag; }

  /* 窗口控制按钮组（复刻 WebView2 Launcher） */
  .window-controls { display:flex; align-items:center; gap:6px; margin-left:auto; }
  .window-btn {
    width:30px; height:30px; background:rgba(0,0,0,.3); border:none; cursor:pointer;
    transition:.2s; display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,.9); border-radius:4px; font-size:0;
  }
  .window-btn:hover { background:rgba(0,0,0,.5); }
  .window-btn.close:hover { background:#e81123; color:#fff; }
  /* 最小化 */
  .window-btn.minimize i { display:inline-block; width:14px; height:2px; background:currentColor; border-radius:1px; }
  /* 最大化 */
  .window-btn.maximize i { display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-radius:2px; }
  /* 关闭 */
  .window-btn.close i { display:inline-block; width:14px; height:14px; position:relative; }
  .window-btn.close i::before, .window-btn.close i::after { content:''; position:absolute; top:50%; left:50%;
    width:14px; height:2px; background:currentColor; border-radius:1px; }
  .window-btn.close i::before { transform:translate(-50%,-50%) rotate(45deg); }
  .window-btn.close i::after { transform:translate(-50%,-50%) rotate(-45deg); }

  /* 主体：左分类 + 右选项 */
  .main { flex:1; display:flex; overflow:hidden; }

  .sidebar {
    width:170px; display:flex; flex-direction:column; background:rgba(13,17,23,.55);
    backdrop-filter:blur(10px);
    border-right:1px solid rgba(255,255,255,.08);
  }
  .sidebar-scroll { flex:1; padding:12px 8px; overflow-y:auto; }
  .cat {
    padding:10px 14px; margin:4px 0; border-radius:8px; cursor:pointer;
    font-size:15px; color:#9aa5b3; transition:.15s;
  }
  .cat:hover { background:#1c2634; color:#e6edf3; }
  .cat.active { background:#ff5a8c; color:#fff; font-weight:600; }

  .panel { flex:1; padding:14px 20px; overflow-y:auto; }
  .panel-title { font-size:20px; color:#fff; margin-bottom:14px; padding:10px 14px;
                 border-radius:10px; background:rgba(0,0,0,.40); backdrop-filter:blur(6px);
                 text-shadow:0 2px 6px rgba(0,0,0,.85); border-bottom:none; }

  /* 载具搜索栏 */
  .search-wrap { margin-bottom:12px; }
  .search-input {
    width:100%; padding:10px 14px; border-radius:8px; font-size:14px;
    background:rgba(0,0,0,.40); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.14); color:#e6edf3; outline:none; transition:.15s;
  }
  .search-input::placeholder { color:#9aa5b3; }
  .search-input:focus { border-color:#ff5a8c; }

  /* 统一选项行：名字 + 右侧开关，所有行样式完全一致 */
  .option {
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px; margin:4px 0; border-radius:8px; cursor:pointer;
    background:rgba(22,28,38,.55); border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(6px); transition:.15s;
  }
  .option:hover { background:rgba(30,40,54,.72); border-color:rgba(255,255,255,.16); }
  .option .name { font-size:14px; color:#dbe2ea; }

  /* 返回上一级条 */
  .backbar {
    display:flex; align-items:center; gap:8px;
    padding:9px 14px; margin-bottom:10px; border-radius:8px; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10);
    color:#9ae6b4; font-size:13px; transition:.15s;
  }
  .backbar:hover { background:rgba(255,255,255,.12); color:#fff; }

  /* 子菜单入口右箭头 */
  .chev { color:#7a5aff; font-size:16px; font-weight:700; flex:none; }

  /* 生成按钮（每次点击刷一辆） */
  .spawn-btn {
    flex:none; padding:5px 14px; border-radius:6px; font-size:12px; cursor:pointer;
    background:linear-gradient(90deg,#22c55e,#16a34a); color:#fff; border:none; transition:.15s;
  }
  .spawn-btn:hover { filter:brightness(1.1); }

  /* 生成按钮点击反馈动画 */
  .spawn-btn.spawned { animation:spawnPop .45s ease; background:linear-gradient(90deg,#22c55e,#15803d); }
  @keyframes spawnPop {
    0%   { transform:scale(1); }
    40%  { transform:scale(1.18); box-shadow:0 0 14px rgba(34,197,94,.85); }
    70%  { transform:scale(.96); }
    100% { transform:scale(1); }
  }

  /* 开关（iOS 样式） */
  .switch { position:relative; width:38px; height:20px; flex:none; }
  .switch input { display:none; }
  .switch .slider {
    position:absolute; inset:0; border-radius:20px; cursor:pointer;
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.18);
    transition:.2s;
  }
  .switch .slider::before {
    content:''; position:absolute; width:14px; height:14px; left:2px; top:2px;
    border-radius:50%; background:#8b98a8; transition:.2s;
  }
  .switch input:checked + .slider { background:#22c55e; border-color:#22c55e; }
  .switch input:checked + .slider::before { transform:translateX(18px); background:#fff; }

  /* 底部提示条 */
  .footer { padding:8px 22px; font-size:12px; color:#cdd6e0; background:rgba(13,17,23,.55); backdrop-filter:blur(10px); border-top:1px solid rgba(255,255,255,.08); }
  .footer .cmd { color:#9ae6b4; }

  /* 初始化按钮（侧边栏底部，启动时不再自动初始化，由用户点击触发） */
  .init-btn {
    margin:8px 10px; padding:10px 14px; border-radius:8px; font-size:13px; cursor:pointer;
    background:linear-gradient(90deg,#6366f1,#8b5cf6); color:#fff; border:none; transition:.18s;
    white-space:nowrap; box-shadow:0 4px 14px rgba(99,102,241,.35); flex:none;
  }
  .init-btn:hover { filter:brightness(1.12); }
  .init-btn:active { transform:scale(.96); }
  .init-btn.busy { background:linear-gradient(90deg,#f59e0b,#f97316); animation:initPulse 1.1s ease infinite; }
  .init-btn.ok   { background:linear-gradient(90deg,#22c55e,#16a34a); }
  .init-btn.fail { background:linear-gradient(90deg,#ef4444,#dc2626); }
  @keyframes initPulse {
    0%,100% { box-shadow:0 0 0 0 rgba(245,158,11,.50); }
    50%     { box-shadow:0 0 0 8px rgba(245,158,11,0); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="topBar">
    <span class="bt">GTA5 Toolkit</span> <small> </small>
    <div class="window-controls">
      <button class="window-btn minimize" id="minimizeBtn"><i></i></button>
      <button class="window-btn maximize" id="maximizeBtn"><i></i></button>
      <button class="window-btn close" id="closeBtn"><i></i></button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-scroll" id="sidebarScroll"></div>
      <button class="init-btn" id="initBtn">初始化</button>
    </div>
    <div class="panel" id="panel">
      <div class="panel-title" id="panelTitle">玩家</div>
      <div class="search-wrap" id="searchWrap" style="display:none;">
        <input class="search-input" id="searchInput" placeholder="搜索载具…（支持中文名 / 车型）">
      </div>
      <div id="optionList"></div>
    </div>
  </div>

  <div class="footer">
    左下角「初始化」= 初次连接游戏 · 点击行 = 切换开关 · 点击「生成」= 刷一辆载具 · 进入子页面后点「返回上一级」回上层 · <span class="cmd">F4/F5/F6</span> = 传送热键
  </div>
</div>

<script src="js/vehicles.js"></script>
<script>
// ============ 数据模型（与 C++ MenuItems.h 对齐） ============
// 这里t只用于JS内部判断是否是"子菜单导航"，不显示在界面上
// 循环/执行/开关的区别一律交给 C++ 处理，HTML 只管一个开关
const CATEGORIES = [
  { id:"player", name:"玩家", items:[
    {n:"无敌模式"},{n:"自动消星"},{n:"无碰撞体积"},
    {n:"角色防子弹"},{n:"角色防火烧"},{n:"角色防撞击"},{n:"角色防近战"},
    {n:"角色防无敌"},{n:"角色防爆炸"},{n:"角色防蒸汽"},{n:"角色防溺水"},{n:"角色防海水"},
    {n:"补满血量"},{n:"补满护甲"},{n:"玩家自杀"},{n:"雷达影踪"},{n:"无布娃娃"},{n:"角色隐形"},{n:"消除星星"},
  ]},
  { id:"world", name:"世界", items:[] },
  { id:"teleport", name:"传送", items:[
    {n:"【F4】坐标向前微调"},{n:"【F5】传送至导航点"},{n:"【F6】传送至目标点"},
  ]},
  { id:"weapon", name:"武器", items:[ {n:"无限弹药"} ]},
  { id:"mission", name:"任务", items:[ {n:"跳过任务"} ]},
  { id:"vehicle", name:"载具", items:[
    {n:"载具设置",sub:true},{n:"小型汽车",sub:true},{n:"轿车",sub:true},{n:"SUV",sub:true},{n:"轿跑车",sub:true},
    {n:"肌肉车",sub:true},{n:"经典跑车",sub:true},{n:"跑车",sub:true},{n:"超级跑车",sub:true},
    {n:"摩托车",sub:true},{n:"越野车",sub:true},{n:"工业用车",sub:true},{n:"公共事业用车",sub:true},
    {n:"厢型车",sub:true},{n:"自行车",sub:true},{n:"船",sub:true},{n:"直升机",sub:true},{n:"飞机",sub:true},
    {n:"服务用车",sub:true},{n:"特种车",sub:true},{n:"军用车",sub:true},{n:"商用车",sub:true},
    {n:"火车",sub:true},{n:"开轮式",sub:true},
  ]},
  { id:"protect", name:"保护", items:[ {n:"防弹"} ]},
  { id:"outfit", name:"装扮", items:[ {n:"更换装扮"} ]},
  { id:"setting", name:"设置", items:[ {n:"显示FPS"} ]},
  { id:"lua", name:"LUA", items:[ {n:"LUA脚本"} ]},
  { id:"log", name:"日志", items:[] },
];

// 车型数据从 vehicles.js 加载（由 VehicleHashData.h 自动生成）
// 全局 VEHICLE_DATA：23 分类，每项含 name + vehicles[{n:显示名, m:模型, mods:49项改装}]

const state = {}; // "catId:idx" -> true/false
CATEGORIES.forEach(c => c.items.forEach((it,i)=> state[c.id+":"+i]=false));

let currentCat = 0;
let subPath = null; // {classIdx}
let searchQuery = "";
let scrollStack = []; // 记录进入二级菜单前的滚动位置
const g_logs = [];   // 后端日志数组（「日志」分类显示）

// ============ 渲染 ============
function renderSidebar(){
  const sb=document.getElementById("sidebarScroll"); sb.innerHTML="";
  CATEGORIES.forEach((c,i)=>{
    const d=document.createElement("div");
    d.className="cat"+(i===currentCat?" active":""); d.textContent=c.name;
    d.onclick=()=>{ currentCat=i; subPath=null; scrollStack=[]; renderAll(); scrollPanel(0); };
    sb.appendChild(d);
  });
}

// 生成一个统一开关行
function makeSwitchRow(cat, idx, name){
  const row=document.createElement("div");
  row.className="option";
  const key=cat+":"+idx;
  const on=!!state[key];
  row.innerHTML = '<span class="name">'+name+'</span>'+
    '<label class="switch"><input type="checkbox"'+(on?' checked':'')+'><span class="slider"></span></label>';
  const cb=row.querySelector("input");
  row.onclick=(e)=>{ e.preventDefault(); cb.checked=!cb.checked; state[key]=cb.checked; send("command",{category:cat,option:idx,state:cb.checked}); };
  cb.onchange=()=>{ state[key]=cb.checked; send("command",{category:cat,option:idx,state:cb.checked}); };
  return row;
}

// ---- 模糊匹配：忽略空格/大小写/符号，支持子串+子序列+罗马数字 ----
function normText(s){
  let t=String(s).toLowerCase();
  // 独立罗马数字词 → 数字（mk ii -> mk 2）
  t=t.replace(/(?<![a-z])viii(?![a-z])/g,'8')
     .replace(/(?<![a-z])vii(?![a-z])/g,'7')
     .replace(/(?<![a-z])iii(?![a-z])/g,'3')
     .replace(/(?<![a-z])ii(?![a-z])/g,'2')
     .replace(/(?<![a-z])iv(?![a-z])/g,'4')
     .replace(/(?<![a-z])vi(?![a-z])/g,'6')
     .replace(/(?<![a-z])ix(?![a-z])/g,'9')
     .replace(/(?<![a-z])i(?![a-z])/g,'1')
     .replace(/(?<![a-z])v(?![a-z])/g,'5')
     .replace(/(?<![a-z])x(?![a-z])/g,'10');
  // 去空格/符号，保留数字/字母/中文
  return t.replace(/[^a-z0-9\u4e00-\u9fff]+/g,'');
}
function isSubseq(q,t){
  let i=0;
  for(let j=0;j<t.length && i<q.length;j++){ if(t[j]===q[i]) i++; }
  return i===q.length;
}
function fuzzyMatch(name, model, query){
  const q=normText(query); if(!q) return true;
  const n=normText(name), m=normText(model);
  // 子串（忽略空格/大小写/符号后）
  if (n.includes(q) || m.includes(q)) return true;
  // 子序列容错（仅查询词 >=3 字符时用，避免短词刷屏）
  if (q.length>=3 && (isSubseq(q,n) || isSubseq(q,m))) return true;
  return false;
}

function renderPanel(){
  const cat=CATEGORIES[currentCat];
  const title=document.getElementById("panelTitle");
  const list=document.getElementById("optionList");
  const searchWrap=document.getElementById("searchWrap");
  list.innerHTML="";

  // 搜索栏：仅在「载具」分类顶层显示
  const showSearch = (cat.id==="vehicle" && subPath==null);
  if (searchWrap) searchWrap.style.display = showSearch ? "block" : "none";

  // 子页面显示「返回上一级」
  if (subPath != null){
    const back=document.createElement("div");
    back.className="backbar";
    back.innerHTML='<span>&#8249;</span> 返回上一级';
    back.onclick=()=>{ subPath=null; renderAll(); scrollPanel(scrollStack.length ? scrollStack.pop() : 0); };
    list.appendChild(back);
  }

  // 载具 → 车型列表（每行一个「生成」按钮）
  if (cat.id==="vehicle" && subPath){
    const cls=VEHICLE_DATA[subPath.classIdx];
    if (!cls){
      title.innerHTML="载具设置";
      appendEmpty(list);
      return;
    }
    title.innerHTML=cls.name;
    cls.vehicles.forEach(v=> list.appendChild(makeSpawnRow(v)));
    return;
  }

  title.innerHTML=cat.name;

  // 「日志」分类：实时显示后端日志
  if (cat.id==="log"){
    renderLogs(list);
    return;
  }

  // 载具顶层 + 有搜索词 → 全库模糊搜索结果
  if (showSearch && searchQuery.trim()!==""){
    const q=searchQuery.trim();
    const results=[];
    VEHICLE_DATA.forEach(c=> c.vehicles.forEach(v=>{
      if (fuzzyMatch(v.n, v.m, q))
        results.push({n:v.n, m:v.m, mods:v.mods});
    }));
    if (results.length===0){ appendEmpty(list); return; }
    results.forEach(v=> list.appendChild(makeSpawnRow(v)));
    return;
  }

  if (cat.items.length===0){ appendEmpty(list); return; }

  cat.items.forEach((it,i)=>{
    if (it.sub){
      // 子菜单入口：名字 + 右箭头
      const row=document.createElement("div");
      row.className="option";
      row.innerHTML='<span class="name">'+it.n+'</span><span class="chev">&#8250;</span>';
      row.onclick=(e)=>{ e.preventDefault(); scrollStack.push(getPanelScroll()); const classIdx=i-1; subPath={classIdx}; renderAll(); scrollPanel(0); };
      list.appendChild(row);
    } else {
      list.appendChild( makeSwitchRow(cat.id, i, it.n) );
    }
  });
}

function appendEmpty(list){
  const d=document.createElement("div");
  d.style.color="#8b98a8"; d.style.padding="20px 0";
  d.textContent="（该分类暂无功能项）";
  list.appendChild(d);
}

// 「日志」分类：逐行显示后端日志
function renderLogs(list){
  // 空日志：不显示任何提示，直接留白
  if (g_logs.length===0){ return; }
  const pre=document.createElement("div");
  pre.style.cssText="white-space:pre-wrap; word-break:break-all; font-family:'GTAFont'; font-size:12px; line-height:1.5; color:#9ae6b4; padding:10px; background:rgba(0,0,0,.35); border-radius:8px; border:1px solid rgba(255,255,255,.08);";
  pre.textContent=g_logs.join("\n");
  list.appendChild(pre);
}

// 生成按钮点击反馈：弹出动画 + 变「✓ 已生成」，700ms 后恢复
function spawnFeedback(btn){
  if (btn.dataset.busy) return;
  btn.dataset.busy="1";
  const orig=btn.textContent;
  btn.classList.add("spawned");
  btn.textContent="✓ 已生成";
  setTimeout(()=>{ btn.classList.remove("spawned"); btn.textContent=orig; delete btn.dataset.busy; }, 700);
}

// 生成行（名字 + 生成按钮）；供车型列表和搜索结果复用
function makeSpawnRow(v){
  const row=document.createElement("div");
  row.className="option";
  row.innerHTML='<span class="name">'+v.n+'</span><button class="spawn-btn">生成</button>';
  const btn=row.querySelector(".spawn-btn");
  const fire=(e)=>{ e.preventDefault(); spawnFeedback(btn); send("spawnVehicle",{model:v.m,mods:v.mods}); };
  row.onclick=fire;
  btn.onclick=(e)=>{ e.stopPropagation(); fire(e); };
  return row;
}

function getPanelScroll(){ const p=document.querySelector('.panel'); return p ? p.scrollTop : 0; }
function scrollPanel(top){ const p=document.querySelector('.panel'); if(p) p.scrollTop=top; }

// ============ 窗口控制按钮 + 顶栏拖拽（复刻 WebView2 Launcher） ============
['minimizeBtn','maximizeBtn','closeBtn'].forEach(id=>{
  const btn=document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('click', ()=>{
    const action = id==='minimizeBtn' ? 'minimize' : (id==='maximizeBtn' ? 'maximize' : 'close');
    send('windowControl', { action });
  });
});

const topBar=document.getElementById('topBar');
if (topBar){
  topBar.addEventListener('mousedown', (e)=>{
    if (e.button!==0) return;
    if (e.target.closest('button')) return;  // 按钮不触发拖拽
    send('windowControl', { action:'move' });
    e.preventDefault();
  });
  topBar.addEventListener('dblclick', (e)=>{
    if (e.target.closest('button')) return;
    send('windowControl', { action:'maximize' });  // C++ maximize 自带切换
    e.preventDefault();
  });
}

function renderAll(){ renderSidebar(); renderPanel(); }

// ============ WebView2 桥接 ============
function send(cmd, payload){
  const msg={ cmd, payload };
  if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage){
    window.chrome.webview.postMessage(JSON.stringify(msg));
  } else {
    console.log("[bridge]", JSON.stringify(msg));
  }
}

// ============ 初始化按钮 ============
// 原 C++ 是启动就自动初始化；现在改成由用户点击触发，点击后向后端发 {cmd:"init"}
let initState = "idle";  // idle | init | ok | fail
const initBtn = document.getElementById("initBtn");
function setInitBtn(label, cls){
  if (!initBtn) return;
  initBtn.textContent = label;
  initBtn.className = "init-btn" + (cls ? " "+cls : "");
}
function doInit(){
  if (initState === "init") return;  // 防止重复触发
  initState = "init";
  setInitBtn("初始化中…", "busy");
  send("init", {});
  // 真正等待后端 initResult；若超时仍未收到回应，兜底为失败（不乐观抢答成成功）
  setTimeout(()=>{
    if (initState === "init"){ initState = "fail"; setInitBtn("初始化失败", "fail"); }
  }, 5000);
}
if (initBtn) initBtn.addEventListener("click", doInit);

// 监听后端下发的初始化结果（后端写完 initResult 后生效）
function onBackendMessage(raw){
  let msg;
  try{
    if (typeof raw === "string") msg = JSON.parse(raw);
    else if (raw && raw.data != null) msg = typeof raw.data === "string" ? JSON.parse(raw.data) : raw.data;
    else msg = raw;
  }catch(err){ return; }
  if (msg && msg.cmd === "initResult"){
    const ok = !!(msg.payload && msg.payload.ok);
    initState = ok ? "ok" : "fail";
    setInitBtn(ok ? "✓ 已初始化" : "初始化失败", ok ? "ok" : "fail");
  }
  if (msg && msg.cmd === "log"){
    const text = (msg.payload && msg.payload.text) || "";
    g_logs.push(text);
    // 当前在「日志」分类时实时刷新，否则切到日志分类时一次性显示
    if (CATEGORIES[currentCat] && CATEGORIES[currentCat].id === "log"){
      const list=document.getElementById("optionList");
      if (list) renderLogs(list);
    }
  }
}
if (window.chrome && window.chrome.webview && window.chrome.webview.addEventListener){
  window.chrome.webview.addEventListener("message", onBackendMessage);
}
// 纯浏览器预览/调试：允许通过 window.postMessage 模拟后端消息（生产 WebView2 不受影响）
window.addEventListener("message", (e)=>onBackendMessage(e.data));

// 搜索框输入 → 实时过滤
const searchInput=document.getElementById("searchInput");
if (searchInput){
  searchInput.addEventListener("input", ()=>{ searchQuery=searchInput.value; renderPanel(); scrollPanel(0); });
}

renderAll();
console.log("[ui ready] GTA5 Toolkit HTML UI");
</script>
